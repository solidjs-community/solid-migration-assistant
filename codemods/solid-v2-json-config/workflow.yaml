# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-transform
    name: Update Solid v2 package and config files
    type: automatic
    steps:
      - name: "Update Solid v2 package and config files"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "json"
          include:
            - "**/package.json"
            - "**/package-lock.json"
            - "**/tsconfig.json"
            - "**/tsconfig.*.json"
            - "**/jsconfig.json"
            - "**/jsconfig.*.json"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
