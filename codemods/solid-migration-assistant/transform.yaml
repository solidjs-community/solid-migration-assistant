# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: relocate-legacy-solid-subpaths
    name: Relocate deterministic legacy Solid subpath imports
    type: automatic
    steps:
      - name: Rewrite the five pure legacy subpath module sources
        js-ast-grep:
          js_file: scripts/transform.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: Emit the relocation report once in deterministic whole-string order
        js-ast-grep:
          js_file: scripts/emit-report.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
