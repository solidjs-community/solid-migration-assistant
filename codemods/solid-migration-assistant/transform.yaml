# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-deterministic-solid-2-rewrites
    name: Apply the deterministic Solid 2 source rewrites
    type: automatic
    steps:
      - name: relocateLegacySubpaths
        js-ast-grep:
          js_file: scripts/transformations/relocateLegacySubpaths.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: relocateWebPackage
        js-ast-grep:
          js_file: scripts/transformations/relocateWebPackage.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: rewriteClassListToClass
        js-ast-grep:
          js_file: scripts/transformations/rewriteClassListToClass.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: Emit the rewrite report once in deterministic whole-string order
        js-ast-grep:
          js_file: scripts/emit-report.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
