# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: analyze-solid-migration-sites
    name: Analyze supported Solid 2 migration sites
    type: automatic
    steps:
      - name: Detect exact migration sites without changing source
        js-ast-grep:
          js_file: scripts/analyze.ts
          base_path: "."
          language: "tsx"
          semantic_analysis: file
          include:
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: Emit all guidance once in deterministic source order
        js-ast-grep:
          js_file: scripts/emit.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - "**/*.tsx"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
