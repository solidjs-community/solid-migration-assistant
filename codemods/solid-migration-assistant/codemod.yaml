schema_version: "1.0"

name: "solid-migration-assistant"
version: "0.2.0"
description: "Read-only Solid 1.9 to Solid 2 beta.34 migration analyzer for project-owned JavaScript and TypeScript source"
author: "Solid Migration Assistant Contributors"
license: "MIT"
category: "migration"

targets:
  languages: ["javascript", "typescript"]

keywords: ["solid", "solidjs", "solid-2", "migration", "codemod", "analyzer", "javascript", "typescript", "jsx", "tsx"]

registry:
  access: "public"
  visibility: "public"

capabilities: []

workflows:
  - name: analyze
    default: true
    path: workflow.yaml
