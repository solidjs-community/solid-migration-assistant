schema_version: "1.0"

name: "solid-migration-assistant"
version: "0.3.0"
description: "Solid 1.9 to Solid 2 RC migration assistant: read-only analyzer plus deterministic legacy import-path relocation and intrinsic JSX classList-to-class rewriting for project-owned JavaScript and TypeScript source"
author: "Solid Migration Assistant Contributors"
license: "MIT"
category: "migration"

targets:
  languages: ["javascript", "typescript"]

keywords: ["solid", "solidjs", "solid-2", "migration", "codemod", "analyzer", "javascript", "typescript", "jsx", "tsx"]

registry:
  access: "public"
  visibility: "public"

capabilities: []

workflows:
  - name: analyze
    default: true
    path: workflow.yaml
  - name: transform
    default: false
    path: transform.yaml
