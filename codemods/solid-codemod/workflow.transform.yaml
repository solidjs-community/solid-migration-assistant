# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: transform-solid-v2-safe-rules
    name: Transform all supported safe Solid 2 rules
    type: automatic
    steps:
      - name: Apply all registered safe transforms
        js-ast-grep:
          js_file: scripts/transform.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.tsx"
          exclude:
            - "**/.codemod-reports/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
