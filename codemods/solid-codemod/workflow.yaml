# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-transforms
    name: Apply Solid 1.x to 2 local-safe transformations
    type: automatic
    steps:
      - name: "Rewrite Solid source imports and local-safe JSX patterns"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"

      - name: "Update Solid JSX config and package dependency entries"
        js-ast-grep:
          js_file: scripts/json-config.ts
          base_path: "."
          language: "json"
          include:
            - "**/package.json"
            - "**/tsconfig.json"
            - "**/tsconfig.*.json"
            - "**/jsconfig.json"
            - "**/jsconfig.*.json"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"


  - id: install-package-skill
    name: Install Package Skill
    type: automatic
    steps:
      - id: install-package-skill
        name: Install package skill
        install-skill:
          package: "solid-codemod"
          path: "./agents/skill/solid-codemod/SKILL.md"
