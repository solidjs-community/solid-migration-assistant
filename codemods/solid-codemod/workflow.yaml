# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: analyze-solid-v2-sites
    name: Analyze supported Solid 2 migration sites
    type: automatic
    steps:
      - name: Remove stale generated reports
        js-ast-grep:
          js_file: scripts/write-report.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - ".codemod-reports/solid-v2/solid-v2-migration-report.json"
            - ".codemod-reports/solid-v2/solid-v2-migration-report.html"
      - name: Detect exact migration sites without changing source
        js-ast-grep:
          js_file: scripts/analyze.ts
          base_path: "."
          language: "tsx"
          semantic_analysis: file
          include:
            - "**/*.tsx"
          exclude:
            - "**/.codemod-reports/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: Write canonical JSON and self-contained HTML reports
        js-ast-grep:
          js_file: scripts/write-report.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - "**/*.tsx"
          exclude:
            - "**/.codemod-reports/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
