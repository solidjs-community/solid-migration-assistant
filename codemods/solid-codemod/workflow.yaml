# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

params:
  schema:
    report_directory:
      name: Report directory
      description: Target-relative directory for JSON and HTML report artifacts
      type: string
      default: ".codemod-reports/solid-v2"

nodes:
  - id: analyze-solid-v2-sites
    name: Analyze supported Solid 2 migration sites
    type: automatic
    steps:
      - name: Detect exact migration sites without changing source
        js-ast-grep:
          js_file: scripts/analyze.ts
          base_path: "."
          language: "tsx"
          semantic_analysis: file
          include:
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/.codemod-reports/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
      - name: Write canonical JSON and self-contained HTML reports
        js-ast-grep:
          js_file: scripts/write-report.ts
          base_path: "."
          language: "tsx"
          max_threads: 1
          include:
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/.codemod-reports/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/coverage/**"
            - "**/*.d.ts"
