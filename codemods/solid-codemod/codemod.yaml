schema_version: "1.0"

name: "solid-v2-codemod"
version: "0.1.0"
description: "Analyze and safely transform supported Solid 1.9 migration sites for Solid 2 beta.30"
author: "Solid Codemod Contributors"
license: "MIT"
category: "migration"

targets:
  languages: ["typescript"]

keywords: ["solid", "solidjs", "analysis", "transform", "migration"]

registry:
  access: "public"
  visibility: "public"

capabilities: []

workflows:
  - name: analyze
    default: true
    path: workflow.yaml
  - name: transform
    default: false
    path: workflow.transform.yaml
