schema_version: "1.0"

name: "solid-v2-readonly-analysis"
version: "0.1.0"
description: "Report exact Solid 1.9 migration sites for Solid 2 beta.30"
author: "Solid Codemod Contributors"
license: "MIT"
category: "migration"

targets:
  languages: ["typescript"]

keywords: ["solid", "solidjs", "readonly", "analysis", "migration"]

registry:
  access: "public"
  visibility: "public"

capabilities: []

workflows:
  - name: analyze
    default: true
    path: workflow.yaml
  - name: transform-web-imports
    default: false
    path: workflow.transform-web-imports.yaml
