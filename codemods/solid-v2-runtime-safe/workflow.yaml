# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-transform
    name: Apply local-safe Solid v2 runtime and API migrations
    type: automatic
    steps:
      - name: "Apply local-safe Solid v2 runtime and API migrations"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include:
            - "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
